name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional hardening once configured on npmjs.com + GitHub repo settings:
    # environment: npm

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js (with npm OIDC Trusted Publishing support)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Run unit tests & verify tarball
        run: |
          npm test
          node -e "if (require('fs').readFileSync('bin/agent-zzz.js').includes('\r\n')) { console.error('CRLF detected in bin/agent-zzz.js'); process.exit(1); }"
          npm pack --dry-run

      - name: Publish to npm via OIDC Trusted Publishing
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
